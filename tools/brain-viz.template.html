<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Opticon — the archive watches itself</title>
<style>
  :root {
    --bg: #05070d;
    --panel: rgba(14, 18, 30, 0.9);
    --panel-solid: #0e121e;
    --prisoner: #5ad4e6;
    --watcher: #ff6b7a;
    --exit: #59f7a6;
    --idea: #ffb020;
    --explore: #b18cff;
    --text: #dfe8f7;
    --muted: #8595b0;
    --line: rgba(120, 150, 200, 0.14);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: radial-gradient(ellipse at 50% 40%, #0a0f1c 0%, var(--bg) 65%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  header { text-align: center; padding: 26px 16px 6px; }
  header h1 {
    margin: 0; font-size: 26px; letter-spacing: .12em; font-weight: 700;
    color: var(--prisoner); text-shadow: 0 0 18px rgba(90, 212, 230, .35);
  }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .toolbar {
    display: flex; gap: 14px; justify-content: center; align-items: center;
    flex-wrap: wrap; padding: 14px 16px 4px;
  }
  .toolbar input {
    background: var(--panel-solid); border: 1px solid var(--line); border-radius: 6px;
    color: var(--text); padding: 6px 10px; font-size: 12.5px; width: 220px;
  }
  .toolbar input::placeholder { color: var(--muted); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .legend .item {
    display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
    cursor: pointer; user-select: none; padding: 3px 8px; border-radius: 12px;
    border: 1px solid transparent; transition: opacity .12s, border-color .12s;
  }
  .legend .item:hover { border-color: var(--line); }
  .legend .item.off { opacity: .35; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .stage { display: flex; justify-content: center; padding: 4px 16px 10px; }
  svg { max-width: 980px; width: 100%; height: auto; overflow: visible; }
  .hide-memory .k-memory { display: none; }
  .hide-tension .k-tension { display: none; }
  .hide-idea .k-idea { display: none; }
  .hide-exploration .k-exploration { display: none; }
  .sweep { transform-origin: 500px 500px; animation: spin 30s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tower-body { fill: var(--panel-solid); stroke: var(--prisoner); stroke-width: 2; }
  .tower-iris { fill: none; stroke: var(--prisoner); stroke-width: 2; opacity: .8; }
  .tower-pupil { fill: var(--watcher); }
  .spiral-guide { fill: none; stroke: var(--line); stroke-width: 1; }
  .tick { stroke: var(--line); stroke-width: 1; }
  .tick-label { fill: var(--muted); font-size: 10px; }
  .hit { fill: transparent; cursor: pointer; }
  .mark { pointer-events: none; transition: opacity .15s ease; }
  .node-group.dim .mark { opacity: .1; }
  .node-group:hover .mark, .node-group.pinned .mark { filter: drop-shadow(0 0 5px currentColor); }
  #tip {
    position: fixed; max-width: 340px; pointer-events: none; z-index: 10;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font-size: 12.5px; line-height: 1.45; color: var(--text);
    box-shadow: 0 8px 24px rgba(0,0,0,.45); opacity: 0; transition: opacity .1s ease;
    backdrop-filter: blur(6px);
  }
  #tip.show { opacity: 1; }
  #tip .tt { font-weight: 700; margin-bottom: 4px; }
  #tip .tk { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  footer { text-align: center; color: var(--muted); font-size: 11px; padding: 4px 16px 34px; opacity: .75; }
  footer code { color: var(--prisoner); }
</style>
</head>
<body>
  <header>
    <h1>OPTICON</h1>
    <p id="subtitle">the archive watches itself</p>
  </header>
  <div class="toolbar">
    <input id="filter" type="text" placeholder="filter by project…" autocomplete="off" />
    <div class="legend" id="legend"></div>
  </div>
  <div class="stage"><svg id="viz" viewBox="0 0 1000 1000" role="img" aria-label="Time spiral of every Brain memory, tension, idea, and exploration entry from day one to today"></svg></div>
  <footer>
    generated <span id="gendate"></span> · regenerate with <code>node tools/brain-viz.mjs</code>
    · one spiral turn ≈ one span of time, day one at the tower, today at the rim · click a legend swatch to hide a type
  </footer>
  <div id="tip"></div>

<script>
const DATA = /*__DATA__*/;

const CX = 500, CY = 500;
const R_MIN = 85, R_MAX = 460;

const STATUS_COLOR = { open: "#ff6b7a", leaning: "#ffb020", resolved: "#59f7a6" };
const STATE_COLOR = { live: "#b18cff", spent: "#55607a" };
function stateColor(state) {
  if (/promoted/i.test(state)) return "#7ee787";
  return STATE_COLOR[state] || "#b18cff";
}
const TAG_PALETTE = {
  gamedesign: "#5ad4e6", ai: "#b18cff", testing: "#ffd166", devops: "#8595b0",
  gamedev: "#5ad4e6", determinism: "#ff9f5a", state: "#7ee787", cutscene: "#f778ba",
  browser: "#5ad4e6", input: "#ffd166", rendering: "#b18cff", balance: "#59f7a6",
  algorithm: "#ff9f5a", algo: "#ff9f5a", process: "#8595b0", tooling: "#8595b0",
};
function tagColor(tags) {
  for (const t of tags || []) if (TAG_PALETTE[t]) return TAG_PALETTE[t];
  return "#dfe8f7";
}

// ---- Time -> spiral position -----------------------------------------------
function daysBetween(a, b) {
  return Math.round((new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 86400000);
}
const totalDays = Math.max(1, daysBetween(DATA.minDate, DATA.maxDate));
const TURNS = Math.min(10, Math.max(4, totalDays / 7));
const dayArcWidth = Math.min(60, (360 * TURNS) / totalDays);

const byDate = new Map();
for (const e of DATA.entries) {
  if (!byDate.has(e.date)) byDate.set(e.date, []);
  byDate.get(e.date).push(e);
}

function polar(r, deg) {
  const rad = (deg - 90) * Math.PI / 180;
  return [CX + r * Math.cos(rad), CY + r * Math.sin(rad)];
}

function placement(e) {
  const t = daysBetween(DATA.minDate, e.date) / totalDays;
  const dayList = byDate.get(e.date);
  const idx = dayList.indexOf(e);
  const within = dayList.length > 1 ? (idx + 0.5) / dayList.length - 0.5 : 0;
  const angle = t * TURNS * 360 + within * dayArcWidth;
  const radius = R_MIN + t * (R_MAX - R_MIN);
  return polar(radius, angle);
}

const svg = document.getElementById("viz");
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

// ---- Guide spiral + month ticks --------------------------------------------
{
  let d = "";
  const STEPS = 720;
  for (let i = 0; i <= STEPS; i++) {
    const t = i / STEPS;
    const [x, y] = polar(R_MIN + t * (R_MAX - R_MIN), t * TURNS * 360);
    d += (i === 0 ? "M " : "L ") + x.toFixed(1) + " " + y.toFixed(1) + " ";
  }
  svg.appendChild(el("path", { class: "spiral-guide", d }));
}
{
  const months = [];
  const start = new Date(DATA.minDate + "T00:00:00Z");
  const end = new Date(DATA.maxDate + "T00:00:00Z");
  const cursor = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + 1, 1));
  while (cursor <= end) {
    months.push(cursor.toISOString().slice(0, 10));
    cursor.setUTCMonth(cursor.getUTCMonth() + 1);
  }
  const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  for (const dateStr of months) {
    const t = daysBetween(DATA.minDate, dateStr) / totalDays;
    const angle = t * TURNS * 360;
    const radius = R_MIN + t * (R_MAX - R_MIN);
    const [x1, y1] = polar(radius - 7, angle);
    const [x2, y2] = polar(radius + 7, angle);
    svg.appendChild(el("line", { class: "tick", x1, y1, x2, y2 }));
    const [lx, ly] = polar(radius + 16, angle);
    const label = el("text", { class: "tick-label", x: lx, y: ly, "text-anchor": "middle" });
    label.textContent = MONTH_NAMES[Number(dateStr.slice(5, 7)) - 1];
    svg.appendChild(label);
  }
}

// ---- Gaze sweep + tower -----------------------------------------------------
{
  const sweep = el("g", { class: "sweep" });
  const [x1, y1] = polar(R_MAX + 25, -45);
  const [x2, y2] = polar(R_MAX + 25, 45);
  const path = el("path", { d: `M ${CX} ${CY} L ${x1} ${y1} A ${R_MAX + 25} ${R_MAX + 25} 0 0 1 ${x2} ${y2} Z`, fill: "url(#gazeGrad)" });
  const defs = el("defs", {});
  const grad = el("radialGradient", { id: "gazeGrad" });
  grad.appendChild(el("stop", { offset: "0%", "stop-color": "#5ad4e6", "stop-opacity": "0.08" }));
  grad.appendChild(el("stop", { offset: "100%", "stop-color": "#5ad4e6", "stop-opacity": "0" }));
  defs.appendChild(grad);
  svg.appendChild(defs);
  sweep.appendChild(path);
  svg.appendChild(sweep);
}
svg.appendChild(el("circle", { class: "tower-body", cx: CX, cy: CY, r: 54 }));
svg.appendChild(el("circle", { class: "tower-iris", cx: CX, cy: CY, r: 32 }));
svg.appendChild(el("circle", { class: "tower-pupil", cx: CX, cy: CY, r: 10 }));

// ---- Tooltip ----------------------------------------------------------------
const tip = document.getElementById("tip");
let pinned = null;
function showTip(evt, html) {
  tip.innerHTML = html;
  tip.classList.add("show");
  moveTip(evt);
}
function moveTip(evt) {
  const pad = 16;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + 350 > window.innerWidth) x = evt.clientX - 350 - pad;
  if (y + 180 > window.innerHeight) y = evt.clientY - 180 - pad;
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}
function hideTip() { if (!pinned) tip.classList.remove("show"); }
document.addEventListener("mousemove", (e) => { if (tip.classList.contains("show")) moveTip(e); });

function tooltipFor(e) {
  if (e.kind === "memory") {
    return `<div class="tt">${e.id} · ${e.title}</div>
      <div class="tk">${e.date} · ${e.project} · ${e.verified ? "verified" : "assumed"}</div>
      <div style="margin-top:4px">${e.what}</div>
      ${e.rule ? '<div style="margin-top:6px;color:#8595b0"><i>' + e.rule + "</i></div>" : ""}`;
  }
  if (e.kind === "tension") {
    return `<div class="tt">${e.id} · ${e.title}</div>
      <div class="tk">${e.date} · ${e.project}</div>
      <div style="margin-top:4px;color:${STATUS_COLOR[e.status]}">${e.statusText}</div>
      <div style="margin-top:4px">${e.summary}</div>`;
  }
  if (e.kind === "idea") {
    return `<div class="tt">${e.title}</div>
      <div class="tk">${e.date} · ${e.domain}${e.project ? " · " + e.project : ""}</div>
      <div style="margin-top:4px">${e.summary}</div>`;
  }
  return `<div class="tt">${e.id} · ${e.title}</div>
    <div class="tk">${e.date} · ${e.project} · ${e.type} · ${e.state}</div>
    <div style="margin-top:4px">${e.summary}</div>`;
}

// ---- Plot every entry ---------------------------------------------------------
const nodeIndex = []; // {group, project}
for (const e of DATA.entries) {
  const [x, y] = placement(e);
  const group = el("g", { class: `node-group k-${e.kind}` });

  let mark;
  if (e.kind === "memory") {
    mark = el("circle", { class: "mark", cx: x, cy: y, r: 3, fill: tagColor(e.tags), stroke: "#05070d", "stroke-width": 1 });
    group.style.color = tagColor(e.tags);
  } else if (e.kind === "tension") {
    mark = el("circle", { class: "mark", cx: x, cy: y, r: 6.5, fill: STATUS_COLOR[e.status], stroke: "#05070d", "stroke-width": 1.5 });
    group.style.color = STATUS_COLOR[e.status];
  } else if (e.kind === "idea") {
    mark = el("circle", { class: "mark", cx: x, cy: y, r: 4, fill: "rgba(255,176,32,0.15)", stroke: "var(--idea)", "stroke-width": 1.3, "stroke-dasharray": "2 2" });
    group.style.color = "var(--idea)";
  } else {
    const s = 5.4;
    mark = el("rect", { class: "mark", x: x - s / 2, y: y - s / 2, width: s, height: s, fill: stateColor(e.state), transform: `rotate(45 ${x} ${y})`, opacity: e.state === "spent" ? 0.5 : 0.9 });
    group.style.color = stateColor(e.state);
  }
  const hit = el("circle", { class: "hit", cx: x, cy: y, r: 8 });
  const tooltip = tooltipFor(e);
  hit.addEventListener("mouseenter", (ev) => { group.classList.remove("dim"); showTip(ev, tooltip); });
  hit.addEventListener("mouseleave", hideTip);
  hit.addEventListener("click", () => togglePin(group, tooltip));
  group.appendChild(mark);
  group.appendChild(hit);
  svg.appendChild(group);
  nodeIndex.push({ group, project: (e.project || "").toLowerCase() });
}

function togglePin(group, html) {
  if (pinned === group) {
    group.classList.remove("pinned");
    pinned = null;
    tip.classList.remove("show");
    return;
  }
  if (pinned) pinned.classList.remove("pinned");
  pinned = group;
  group.classList.add("pinned");
  tip.innerHTML = html;
  tip.classList.add("show");
}

// ---- Filter by project ------------------------------------------------------
const filterInput = document.getElementById("filter");
filterInput.addEventListener("input", () => {
  const q = filterInput.value.trim().toLowerCase();
  for (const { group, project } of nodeIndex) {
    group.classList.toggle("dim", q.length > 0 && !project.includes(q));
  }
});

// ---- Legend (click to hide a kind) ------------------------------------------
document.getElementById("gendate").textContent = DATA.generated;
document.getElementById("subtitle").textContent =
  `${DATA.entries.length} entries · ${DATA.counts.memory} lessons · ${DATA.counts.tension} tensions · ` +
  `${DATA.counts.idea} ideas · ${DATA.counts.exploration} explorations · ${DATA.projects.length} projects · ` +
  `${DATA.minDate} → ${DATA.maxDate}` +
  (DATA.omitted ? ` · ${DATA.omitted} undated entries omitted` : "");
const legend = document.getElementById("legend");
const legendItems = [
  ["memory", "#5ad4e6", "memory"],
  ["tension (open)", STATUS_COLOR.open, "tension"],
  ["tension (leaning)", STATUS_COLOR.leaning, "tension"],
  ["tension (resolved)", STATUS_COLOR.resolved, "tension"],
  ["idea kernel", "var(--idea)", "idea"],
  ["exploration", "var(--explore)", "exploration"],
];
const hidden = new Set();
for (const [label, color, kind] of legendItems) {
  const item = document.createElement("div");
  item.className = "item";
  item.dataset.kind = kind;
  item.innerHTML = `<span class="swatch" style="background:${color}"></span>${label}`;
  item.addEventListener("click", () => {
    if (hidden.has(kind)) hidden.delete(kind); else hidden.add(kind);
    document.querySelectorAll(`.legend .item[data-kind="${kind}"]`).forEach((n) => n.classList.toggle("off", hidden.has(kind)));
    svg.parentElement.className = [...hidden].map((k) => "hide-" + k).join(" ");
  });
  legend.appendChild(item);
}
</script>
</body>
</html>
