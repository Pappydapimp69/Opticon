<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Opticon — the archive watches itself</title>
<style>
  :root {
    --bg: #05070d;
    --panel: rgba(14, 18, 30, 0.9);
    --panel-solid: #0e121e;
    --prisoner: #5ad4e6;
    --watcher: #ff6b7a;
    --exit: #59f7a6;
    --idea: #ffb020;
    --explore: #b18cff;
    --text: #dfe8f7;
    --muted: #8595b0;
    --line: rgba(120, 150, 200, 0.14);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: radial-gradient(ellipse at 50% 40%, #0a0f1c 0%, var(--bg) 65%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  header { text-align: center; padding: 26px 16px 6px; }
  header h1 {
    margin: 0; font-size: 26px; letter-spacing: .12em; font-weight: 700;
    color: var(--prisoner); text-shadow: 0 0 18px rgba(90, 212, 230, .35);
  }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .toolbar {
    display: flex; gap: 14px; justify-content: center; align-items: center;
    flex-wrap: wrap; padding: 14px 16px 4px;
  }
  .toolbar input {
    background: var(--panel-solid); border: 1px solid var(--line); border-radius: 6px;
    color: var(--text); padding: 6px 10px; font-size: 12.5px; width: 220px;
  }
  .toolbar input::placeholder { color: var(--muted); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .legend .item {
    display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
    cursor: pointer; user-select: none; padding: 3px 8px; border-radius: 12px;
    border: 1px solid transparent; transition: opacity .12s, border-color .12s;
  }
  .legend .item:hover { border-color: var(--line); }
  .legend .item.off { opacity: .35; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  /* Movie controls: default state (no autoplay, no motion) matches the
     static page exactly — playback is opt-in per the retrieved Brain
     lesson (viz/E1) that anything auto-running past a few seconds needs an
     explicit control, and prefers-reduced-motion disables it outright
     rather than offering a control for motion that shouldn't happen. */
  .movie-bar {
    display: flex; gap: 12px; justify-content: center; align-items: center;
    padding: 4px 16px 10px; flex-wrap: wrap;
  }
  .movie-btn {
    background: var(--panel-solid); border: 1px solid var(--line); border-radius: 6px;
    color: var(--text); padding: 7px 14px; font-size: 12.5px; cursor: pointer;
    font-family: inherit; transition: border-color .12s;
  }
  .movie-btn:hover { border-color: var(--prisoner); }
  .movie-btn.icon { padding: 7px 10px; }
  .movie-btn:disabled { opacity: .4; cursor: not-allowed; }
  #scrub { width: 320px; max-width: 50vw; accent-color: var(--prisoner); }
  .stage { display: flex; justify-content: center; padding: 4px 16px 10px; position: relative; }
  svg { max-width: 980px; width: 100%; height: auto; overflow: visible; }
  /* Caption: restrained by design (brain/NARRATION#voiceover-restraint) — it
     supplies WHY a moment mattered, not a restated label for a dot the
     viewer can already see move. Fixed to the stage, not the SVG, so it
     doesn't shift as the camera zooms during playback. */
  .caption {
    position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%);
    max-width: min(560px, 86%); text-align: center; padding: 10px 18px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    font-size: 13.5px; line-height: 1.5; opacity: 0; transition: opacity .4s ease;
    backdrop-filter: blur(6px); pointer-events: none;
  }
  .caption.show { opacity: 1; }
  .caption b { color: var(--prisoner); }
  .hide-memory .k-memory { display: none; }
  .hide-tension .k-tension { display: none; }
  .hide-idea .k-idea { display: none; }
  .hide-exploration .k-exploration { display: none; }
  .sweep { transform-origin: 500px 500px; animation: spin 30s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tower-body { fill: var(--panel-solid); stroke: var(--prisoner); stroke-width: 2; }
  .tower-iris { fill: none; stroke: var(--prisoner); stroke-width: 2; opacity: .8; }
  .tower-pupil { fill: var(--watcher); }
  .spiral-guide { fill: none; stroke: var(--line); stroke-width: 1; }
  .tick { stroke: var(--line); stroke-width: 1; }
  .tick-label { fill: var(--muted); font-size: 10px; }
  .hit { fill: transparent; cursor: pointer; }
  .mark { pointer-events: none; transition: opacity .15s ease; transform-box: fill-box; transform-origin: center; }
  .node-group.dim .mark { opacity: .1; }
  .node-group:hover .mark, .node-group.pinned .mark { filter: drop-shadow(0 0 5px currentColor); }
  /* Reveal state for playback: an entry not yet "arrived" in the story is
     fully suppressed (opacity AND pointer-events), not just dimmed — dim
     is the filter's language (still there, just de-emphasized) and this is
     a different claim (not yet part of the timeline shown so far). A tiny
     built-in overshoot (110% before settling) reads as "arriving" rather
     than "fading in"; brain/anim#E3's frame-rate-independence warning is
     for continuously RE-TARGETED motion (the camera, below) — a one-shot
     reveal fired once per entry doesn't have that failure mode. */
  .node-group.pending .mark, .node-group.pending .hit { opacity: 0; pointer-events: none; }
  .node-group.pop .mark { animation: popIn 360ms cubic-bezier(.22, 1.4, .36, 1) both; }
  @keyframes popIn { 0% { opacity: 0; transform: scale(0.2); } 70% { opacity: 1; transform: scale(1.12); } 100% { opacity: 1; transform: scale(1); } }
  #viz.playing { transition: none; }
  @media (prefers-reduced-motion: reduce) {
    .sweep { animation: none; }
    .node-group.pop .mark { animation: none; opacity: 1; transform: none; }
  }
  #tip {
    position: fixed; max-width: 340px; pointer-events: none; z-index: 10;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font-size: 12.5px; line-height: 1.45; color: var(--text);
    box-shadow: 0 8px 24px rgba(0,0,0,.45); opacity: 0; transition: opacity .1s ease;
    backdrop-filter: blur(6px);
  }
  #tip.show { opacity: 1; }
  #tip .tt { font-weight: 700; margin-bottom: 4px; }
  #tip .tk { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  footer { text-align: center; color: var(--muted); font-size: 11px; padding: 4px 16px 34px; opacity: .75; }
  footer code { color: var(--prisoner); }
</style>
</head>
<body>
  <header>
    <h1>OPTICON</h1>
    <p id="subtitle">the archive watches itself</p>
  </header>
  <div class="toolbar">
    <input id="filter" type="text" placeholder="filter by project…" autocomplete="off" />
    <div class="legend" id="legend"></div>
  </div>
  <div class="movie-bar">
    <button id="playBtn" class="movie-btn" title="Play the story">▶ Play the story</button>
    <input id="scrub" type="range" min="0" max="1000" value="1000" />
    <button id="soundBtn" class="movie-btn icon" title="Toggle sound">🔇</button>
  </div>
  <div class="stage">
    <svg id="viz" viewBox="0 0 1000 1000" role="img" aria-label="Time spiral of every Brain memory, tension, idea, and exploration entry from day one to today"></svg>
    <div id="caption" class="caption"></div>
  </div>
  <footer>
    generated <span id="gendate"></span> · regenerate with <code>node tools/brain-viz.mjs</code>
    · one spiral turn ≈ one span of time, day one at the tower, today at the rim · click a legend swatch to hide a type
  </footer>
  <div id="tip"></div>

<script>
const DATA = /*__DATA__*/;

const CX = 500, CY = 500;
const R_MIN = 85, R_MAX = 460;

const STATUS_COLOR = { open: "#ff6b7a", leaning: "#ffb020", resolved: "#59f7a6" };
const STATE_COLOR = { live: "#b18cff", spent: "#55607a" };
function stateColor(state) {
  if (/promoted/i.test(state)) return "#7ee787";
  return STATE_COLOR[state] || "#b18cff";
}
const TAG_PALETTE = {
  gamedesign: "#5ad4e6", ai: "#b18cff", testing: "#ffd166", devops: "#8595b0",
  gamedev: "#5ad4e6", determinism: "#ff9f5a", state: "#7ee787", cutscene: "#f778ba",
  browser: "#5ad4e6", input: "#ffd166", rendering: "#b18cff", balance: "#59f7a6",
  algorithm: "#ff9f5a", algo: "#ff9f5a", process: "#8595b0", tooling: "#8595b0",
};
function tagColor(tags) {
  for (const t of tags || []) if (TAG_PALETTE[t]) return TAG_PALETTE[t];
  return "#dfe8f7";
}

// ---- Time -> spiral position -----------------------------------------------
function daysBetween(a, b) {
  return Math.round((new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 86400000);
}
const totalDays = Math.max(1, daysBetween(DATA.minDate, DATA.maxDate));
const TURNS = Math.min(10, Math.max(4, totalDays / 7));
const dayArcWidth = Math.min(60, (360 * TURNS) / totalDays);

const byDate = new Map();
for (const e of DATA.entries) {
  if (!byDate.has(e.date)) byDate.set(e.date, []);
  byDate.get(e.date).push(e);
}

function polar(r, deg) {
  const rad = (deg - 90) * Math.PI / 180;
  return [CX + r * Math.cos(rad), CY + r * Math.sin(rad)];
}

function placement(e) {
  const t = daysBetween(DATA.minDate, e.date) / totalDays;
  const dayList = byDate.get(e.date);
  const idx = dayList.indexOf(e);
  const within = dayList.length > 1 ? (idx + 0.5) / dayList.length - 0.5 : 0;
  const angle = t * TURNS * 360 + within * dayArcWidth;
  const radius = R_MIN + t * (R_MAX - R_MIN);
  return polar(radius, angle);
}

const svg = document.getElementById("viz");
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

// ---- Guide spiral + month ticks --------------------------------------------
{
  let d = "";
  const STEPS = 720;
  for (let i = 0; i <= STEPS; i++) {
    const t = i / STEPS;
    const [x, y] = polar(R_MIN + t * (R_MAX - R_MIN), t * TURNS * 360);
    d += (i === 0 ? "M " : "L ") + x.toFixed(1) + " " + y.toFixed(1) + " ";
  }
  svg.appendChild(el("path", { class: "spiral-guide", d }));
}
{
  const months = [];
  const start = new Date(DATA.minDate + "T00:00:00Z");
  const end = new Date(DATA.maxDate + "T00:00:00Z");
  const cursor = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + 1, 1));
  while (cursor <= end) {
    months.push(cursor.toISOString().slice(0, 10));
    cursor.setUTCMonth(cursor.getUTCMonth() + 1);
  }
  const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  for (const dateStr of months) {
    const t = daysBetween(DATA.minDate, dateStr) / totalDays;
    const angle = t * TURNS * 360;
    const radius = R_MIN + t * (R_MAX - R_MIN);
    const [x1, y1] = polar(radius - 7, angle);
    const [x2, y2] = polar(radius + 7, angle);
    svg.appendChild(el("line", { class: "tick", x1, y1, x2, y2 }));
    const [lx, ly] = polar(radius + 16, angle);
    const label = el("text", { class: "tick-label", x: lx, y: ly, "text-anchor": "middle" });
    label.textContent = MONTH_NAMES[Number(dateStr.slice(5, 7)) - 1];
    svg.appendChild(label);
  }
}

// ---- Gaze sweep + tower -----------------------------------------------------
{
  const sweep = el("g", { class: "sweep" });
  const [x1, y1] = polar(R_MAX + 25, -45);
  const [x2, y2] = polar(R_MAX + 25, 45);
  const path = el("path", { d: `M ${CX} ${CY} L ${x1} ${y1} A ${R_MAX + 25} ${R_MAX + 25} 0 0 1 ${x2} ${y2} Z`, fill: "url(#gazeGrad)" });
  const defs = el("defs", {});
  const grad = el("radialGradient", { id: "gazeGrad" });
  grad.appendChild(el("stop", { offset: "0%", "stop-color": "#5ad4e6", "stop-opacity": "0.08" }));
  grad.appendChild(el("stop", { offset: "100%", "stop-color": "#5ad4e6", "stop-opacity": "0" }));
  defs.appendChild(grad);
  svg.appendChild(defs);
  sweep.appendChild(path);
  svg.appendChild(sweep);
}
svg.appendChild(el("circle", { class: "tower-body", cx: CX, cy: CY, r: 54 }));
svg.appendChild(el("circle", { class: "tower-iris", cx: CX, cy: CY, r: 32 }));
svg.appendChild(el("circle", { class: "tower-pupil", cx: CX, cy: CY, r: 10 }));

// ---- Tooltip ----------------------------------------------------------------
const tip = document.getElementById("tip");
let pinned = null;
function showTip(evt, html) {
  tip.innerHTML = html;
  tip.classList.add("show");
  moveTip(evt);
}
function moveTip(evt) {
  const pad = 16;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + 350 > window.innerWidth) x = evt.clientX - 350 - pad;
  if (y + 180 > window.innerHeight) y = evt.clientY - 180 - pad;
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}
function hideTip() { if (!pinned) tip.classList.remove("show"); }
document.addEventListener("mousemove", (e) => { if (tip.classList.contains("show")) moveTip(e); });

function tooltipFor(e) {
  if (e.kind === "memory") {
    return `<div class="tt">${e.id} · ${e.title}</div>
      <div class="tk">${e.date} · ${e.project} · ${e.verified ? "verified" : "assumed"}</div>
      <div style="margin-top:4px">${e.what}</div>
      ${e.rule ? '<div style="margin-top:6px;color:#8595b0"><i>' + e.rule + "</i></div>" : ""}`;
  }
  if (e.kind === "tension") {
    return `<div class="tt">${e.id} · ${e.title}</div>
      <div class="tk">${e.date} · ${e.project}</div>
      <div style="margin-top:4px;color:${STATUS_COLOR[e.status]}">${e.statusText}</div>
      <div style="margin-top:4px">${e.summary}</div>`;
  }
  if (e.kind === "idea") {
    return `<div class="tt">${e.title}</div>
      <div class="tk">${e.date} · ${e.domain}${e.project ? " · " + e.project : ""}</div>
      <div style="margin-top:4px">${e.summary}</div>`;
  }
  return `<div class="tt">${e.id} · ${e.title}</div>
    <div class="tk">${e.date} · ${e.project} · ${e.type} · ${e.state}</div>
    <div style="margin-top:4px">${e.summary}</div>`;
}

// ---- Plot every entry ---------------------------------------------------------
const nodeIndex = []; // {group, mark, project, t, dayIndex}
for (const e of DATA.entries) {
  const [x, y] = placement(e);
  const t = daysBetween(DATA.minDate, e.date) / totalDays;
  const dayIndex = daysBetween(DATA.minDate, e.date);
  const group = el("g", { class: `node-group k-${e.kind}` });

  let mark;
  if (e.kind === "memory") {
    mark = el("circle", { class: "mark", cx: x, cy: y, r: 3, fill: tagColor(e.tags), stroke: "#05070d", "stroke-width": 1 });
    group.style.color = tagColor(e.tags);
  } else if (e.kind === "tension") {
    mark = el("circle", { class: "mark", cx: x, cy: y, r: 6.5, fill: STATUS_COLOR[e.status], stroke: "#05070d", "stroke-width": 1.5 });
    group.style.color = STATUS_COLOR[e.status];
  } else if (e.kind === "idea") {
    mark = el("circle", { class: "mark", cx: x, cy: y, r: 4, fill: "rgba(255,176,32,0.15)", stroke: "var(--idea)", "stroke-width": 1.3, "stroke-dasharray": "2 2" });
    group.style.color = "var(--idea)";
  } else {
    // A CSS `transform: scale(...)` animation on this element (the reveal
    // pop, added below) REPLACES rather than composes with an SVG
    // `transform` attribute on the same element — the rotated diamond
    // would silently un-rotate the instant it played. Keep the rotation on
    // an inner, un-animated <g> and give the outer <g class="mark"> (the
    // thing CSS actually touches) no attribute-based transform of its own.
    const s = 5.4;
    const spin = el("g", { transform: `rotate(45 ${x} ${y})` });
    spin.appendChild(el("rect", { x: x - s / 2, y: y - s / 2, width: s, height: s, fill: stateColor(e.state), opacity: e.state === "spent" ? 0.5 : 0.9 }));
    mark = el("g", { class: "mark" });
    mark.appendChild(spin);
    group.style.color = stateColor(e.state);
  }
  const hit = el("circle", { class: "hit", cx: x, cy: y, r: 8 });
  const tooltip = tooltipFor(e);
  hit.addEventListener("mouseenter", (ev) => { group.classList.remove("dim"); showTip(ev, tooltip); });
  hit.addEventListener("mouseleave", hideTip);
  hit.addEventListener("click", () => togglePin(group, tooltip));
  group.appendChild(mark);
  group.appendChild(hit);
  svg.appendChild(group);
  const dayList = byDate.get(e.date);
  nodeIndex.push({
    entry: e, group, mark, project: (e.project || "").toLowerCase(), t, dayIndex, x, y,
    withinDayIndex: dayList.indexOf(e), withinDayCount: dayList.length,
  });
}

function togglePin(group, html) {
  if (pinned === group) {
    group.classList.remove("pinned");
    pinned = null;
    tip.classList.remove("show");
    return;
  }
  if (pinned) pinned.classList.remove("pinned");
  pinned = group;
  group.classList.add("pinned");
  tip.innerHTML = html;
  tip.classList.add("show");
}

// ---- Filter by project ------------------------------------------------------
const filterInput = document.getElementById("filter");
filterInput.addEventListener("input", () => {
  const q = filterInput.value.trim().toLowerCase();
  for (const { group, project } of nodeIndex) {
    group.classList.toggle("dim", q.length > 0 && !project.includes(q));
  }
});

// ---- Legend (click to hide a kind) ------------------------------------------
document.getElementById("gendate").textContent = DATA.generated;
document.getElementById("subtitle").textContent =
  `${DATA.entries.length} entries · ${DATA.counts.memory} lessons · ${DATA.counts.tension} tensions · ` +
  `${DATA.counts.idea} ideas · ${DATA.counts.exploration} explorations · ${DATA.projects.length} projects · ` +
  `${DATA.minDate} → ${DATA.maxDate}` +
  (DATA.omitted ? ` · ${DATA.omitted} undated entries omitted` : "");
const legend = document.getElementById("legend");
const legendItems = [
  ["memory", "#5ad4e6", "memory"],
  ["tension (open)", STATUS_COLOR.open, "tension"],
  ["tension (leaning)", STATUS_COLOR.leaning, "tension"],
  ["tension (resolved)", STATUS_COLOR.resolved, "tension"],
  ["idea kernel", "var(--idea)", "idea"],
  ["exploration", "var(--explore)", "exploration"],
];
const hidden = new Set();
for (const [label, color, kind] of legendItems) {
  const item = document.createElement("div");
  item.className = "item";
  item.dataset.kind = kind;
  item.innerHTML = `<span class="swatch" style="background:${color}"></span>${label}`;
  item.addEventListener("click", () => {
    if (hidden.has(kind)) hidden.delete(kind); else hidden.add(kind);
    document.querySelectorAll(`.legend .item[data-kind="${kind}"]`).forEach((n) => n.classList.toggle("off", hidden.has(kind)));
    svg.parentElement.className = [...hidden].map((k) => "hide-" + k).join(" ");
  });
  legend.appendChild(item);
}

// ==== MOVIE MODE =============================================================
// Grounded in a brain query on visuals/sound before building (see the shipping
// commit for the retrieved lesson IDs). What each piece below is applying:
//  - semantic-anchor time warp (viz-growth#E7,E9): pacing holds on real beats
//    instead of drifting proportionally through empty stretches.
//  - sqrt-scaled, capped stagger for same-day reveal bursts (garden-viz#E8,E9)
//    instead of a flat per-item delay that would make a 40-idea day take 40x
//    as long as a 1-idea day, or flash by unreadably if capped too hard.
//  - an integer day cursor for deterministic reveal counts (garden-viz#E9)
//    instead of accumulated float time, which reveals different counts at
//    different frame rates for the exact same elapsed wall time.
//  - a camera that clamps to the actual currently-revealed extent
//    (MOTION/camera idea) instead of a blind progress schedule that doesn't
//    know what's really on screen yet.
//  - frame-rate-independent exponential smoothing (anim#E3) for the one
//    continuously RE-TARGETED motion here, the camera zoom — the one-shot
//    reveal pop is a different case (fires once, never re-targeted) and uses
//    an ordinary CSS animation instead.
//  - tolerance-based playback completion, snapped to the true end (viz#E8)
//    rather than a straggling frame leaving it at 99.9% forever.
//  - a drone/riser/stinger three-layer sound model (NARRATION/sound-design),
//    entirely gated behind an explicit user gesture (never on page load or
//    even on Play — only the separate sound toggle creates the AudioContext)
//    per the autoplay-gate lessons (dog#E1, shadow#E1/E2/E4).
//  - auto-run needing a control, and reduced-motion disabling it outright
//    (viz-growth#E1) — the default page state is untouched (nothing plays
//    unless the user asks), and Play is disabled under prefers-reduced-motion.

const reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---- Beats: every tension's own filing date, plus the two bookends. Real
// data only, no invented narration — voiceover-restraint (NARRATION idea)
// means the caption should say why a moment mattered, and a tension's own
// title/status already carries that; nothing here is fabricated.
const beats = DATA.entries
  .filter((e) => e.kind === "tension")
  .map((e) => ({
    t: daysBetween(DATA.minDate, e.date) / totalDays,
    caption: `<b>${e.id} ${e.status}</b> — ${e.title}`,
    cue: e.status,
    _firedRiser: false,
    _firedStinger: false,
  }));
beats.push({ t: 0, caption: `<b>Day one</b> — ${DATA.minDate}. The archive begins.`, cue: "open", _firedRiser: true, _firedStinger: false });
beats.push({ t: 1, caption: `<b>Today</b> — ${DATA.entries.length} entries across ${DATA.projects.length} projects.`, cue: "resolved", _firedRiser: false, _firedStinger: false });
beats.sort((a, b) => a.t - b.t);

// ---- Semantic-anchor warp: map linear playback progress (0..1 over
// MOVIE_DURATION_MS) to raw story position (0..1 over the real date range),
// slowing near each beat (a dwell window, cosine-eased) so autoplay visibly
// HOLDS on a beat instead of crossing it at the same rate as an empty week.
const DWELL_HALF_WIDTH = Math.min(0.05, Math.max(0.006, 1.2 / totalDays));
const MIN_SPEED = 0.15;
function localSpeed(rawT) {
  let speed = 1;
  for (const b of beats) {
    const d = Math.abs(rawT - b.t) / DWELL_HALF_WIDTH;
    if (d < 1) speed = Math.min(speed, MIN_SPEED + (1 - MIN_SPEED) * (0.5 - 0.5 * Math.cos(d * Math.PI)));
  }
  return speed;
}
const WARP_SAMPLES = 2000;
const warpTable = []; // [{rawT, movieT}] — both monotonic 0..1
{
  let cum = 0;
  for (let i = 0; i <= WARP_SAMPLES; i++) {
    const rawT = i / WARP_SAMPLES;
    if (i > 0) cum += (1 / Math.max(MIN_SPEED, localSpeed(rawT))) / WARP_SAMPLES;
    warpTable.push({ rawT, movieT: cum });
  }
  const total = warpTable[warpTable.length - 1].movieT || 1;
  for (const row of warpTable) row.movieT /= total;
}
function movieProgressToRawT(p) {
  p = Math.max(0, Math.min(1, p));
  let lo = 0, hi = warpTable.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (warpTable[mid].movieT < p) lo = mid + 1; else hi = mid;
  }
  return warpTable[lo].rawT;
}
function rawTToMovieProgress(rawT) {
  let lo = 0, hi = warpTable.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (warpTable[mid].rawT < rawT) lo = mid + 1; else hi = mid;
  }
  return warpTable[lo].movieT;
}

// ---- Reveal state. The default page load touches none of this — every
// entry starts fully visible exactly as before movie mode existed; only
// engaging Play or the scrub bar switches into "story" reveal tracking.
let revealedCursor = null; // sentinel: guarantees the first call always runs
let revealedMaxRadius = R_MAX;
function setDayCursor(dayIndex, animate) {
  if (dayIndex === revealedCursor) return;
  revealedCursor = dayIndex;
  let maxR = R_MIN;
  for (const n of nodeIndex) {
    const shouldShow = n.dayIndex <= dayIndex;
    const isPending = n.group.classList.contains("pending");
    if (shouldShow) {
      const r = Math.hypot(n.x - CX, n.y - CY);
      if (r > maxR) maxR = r;
      if (isPending) {
        n.group.classList.remove("pending");
        if (animate) {
          n.group.classList.remove("pop");
          void n.group.offsetWidth; // force reflow so a re-added class restarts the CSS animation
          const win = Math.min(650, 90 * Math.sqrt(n.withinDayCount));
          n.mark.style.animationDelay = (n.withinDayCount > 1 ? (n.withinDayIndex / n.withinDayCount) * win : 0) + "ms";
          n.group.classList.add("pop");
        }
      }
    } else if (!isPending) {
      n.group.classList.add("pending");
      n.group.classList.remove("pop");
    }
  }
  revealedMaxRadius = maxR;
}

// ---- Camera: clamps to what's actually revealed right now (MOTION/camera),
// not a blind schedule, smoothed with a frame-rate-independent exponential
// approach (anim#E3) since it's re-targeted every frame during playback.
let cameraRadius = null;
function applyCamera(dt) {
  const targetR = Math.min(500, revealedMaxRadius + 50);
  if (cameraRadius === null) cameraRadius = targetR;
  else cameraRadius += (targetR - cameraRadius) * (1 - Math.exp(-4 * Math.max(0, dt)));
  const size = cameraRadius * 2;
  svg.setAttribute("viewBox", (CX - cameraRadius) + " " + (CY - cameraRadius) + " " + size + " " + size);
}

// ---- Caption ----------------------------------------------------------------
const captionEl = document.getElementById("caption");
let storyModeActive = false;
let lastBeatShown = null;
function updateCaptionDisplay(rawT) {
  if (!storyModeActive) return;
  let active = null;
  for (const b of beats) if (b.t <= rawT + 1e-6) active = b;
  if (!active) { captionEl.classList.remove("show"); return; }
  if (active !== lastBeatShown) { captionEl.innerHTML = active.caption; lastBeatShown = active; }
  captionEl.classList.add("show");
}

// ---- Sound: drone (mood) + riser (anticipation) + stinger (payoff), the
// three-layer model from NARRATION/sound-design. AudioContext is created
// ONLY here, on the sound toggle specifically — Play alone never touches
// audio — and resume() is fire-and-forget, never awaited on a critical
// path (dog#E1: some browsers leave resume() pending forever).
const soundBtn = document.getElementById("soundBtn");
let audioCtx = null, droneGain = null, soundOn = false;
function ensureAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  droneGain = audioCtx.createGain();
  droneGain.gain.value = 0;
  droneGain.connect(audioCtx.destination);
  const drone = audioCtx.createOscillator();
  drone.type = "sine";
  drone.frequency.value = 55;
  const lfo = audioCtx.createOscillator();
  lfo.frequency.value = 0.07;
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = 6;
  lfo.connect(lfoGain).connect(drone.frequency);
  drone.connect(droneGain);
  drone.start();
  lfo.start();
}
function setSoundOn(on) {
  soundOn = on;
  soundBtn.textContent = on ? "🔊" : "🔇";
  if (on) {
    ensureAudio();
    audioCtx.resume().catch(() => {});
    droneGain.gain.linearRampToValueAtTime(0.035, audioCtx.currentTime + 1.2);
  } else if (audioCtx) {
    droneGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
  }
}
soundBtn.addEventListener("click", () => setSoundOn(!soundOn));

function stinger(status) {
  if (!soundOn || !audioCtx) return;
  const t0 = audioCtx.currentTime;
  const freqs = status === "resolved" ? [660, 990] : status === "leaning" ? [440] : [330, 311];
  freqs.forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0 + i * 0.06);
    g.gain.linearRampToValueAtTime(0.09, t0 + i * 0.06 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.06 + 0.5);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(t0 + i * 0.06);
    osc.stop(t0 + i * 0.06 + 0.55);
  });
}
function riser() {
  if (!soundOn || !audioCtx) return;
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(120, t0);
  osc.frequency.exponentialRampToValueAtTime(360, t0 + 0.5);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.05, t0 + 0.45);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + 0.6);
}
function updateAudioCues(rawT) {
  if (!soundOn) return;
  const lookahead = DWELL_HALF_WIDTH * 0.6;
  for (const b of beats) {
    if (!b._firedRiser && rawT >= b.t - lookahead && rawT < b.t) { riser(); b._firedRiser = true; }
    if (!b._firedStinger && rawT >= b.t) { stinger(b.cue); b._firedStinger = true; }
  }
}

// ---- Playback engine: requestAnimationFrame, never setTimeout (auto-pauses
// when backgrounded, syncs to actual repaint — MOTION/animation-loop idea). ---
const MOVIE_DURATION_MS = 42000;
const playBtn = document.getElementById("playBtn");
const scrub = document.getElementById("scrub");
let currentRawT = 1;
let playing = false;
let pausedProgress = 0;
let startTimestamp = null;
let lastFrameTime = null;

function applyRawT(rawT, dt) {
  currentRawT = rawT;
  scrub.value = String(Math.round(rawT * 1000));
  setDayCursor(Math.floor(rawT * totalDays), true);
  applyCamera(dt);
  updateCaptionDisplay(rawT);
  updateAudioCues(rawT);
}

function frame(ts) {
  if (!playing) return;
  if (startTimestamp === null) startTimestamp = ts - pausedProgress * MOVIE_DURATION_MS;
  const dt = lastFrameTime === null ? 0.016 : Math.min(0.25, (ts - lastFrameTime) / 1000);
  lastFrameTime = ts;
  const progress = (ts - startTimestamp) / MOVIE_DURATION_MS;
  if (progress >= 1) {
    // Tolerance-based completion (viz#E8): snap to the true end instead of
    // trusting the next frame to land exactly on 1, which float accumulation
    // doesn't reliably do.
    applyRawT(1, dt);
    playing = false;
    playBtn.textContent = "▶ Play the story";
    pausedProgress = 0;
    return;
  }
  applyRawT(movieProgressToRawT(progress), dt);
  requestAnimationFrame(frame);
}

function startPlayback() {
  playing = true;
  startTimestamp = null;
  lastFrameTime = null;
  playBtn.textContent = "⏸ Pause";
  requestAnimationFrame(frame);
}
function pausePlayback() {
  playing = false;
  pausedProgress = rawTToMovieProgress(currentRawT);
  playBtn.textContent = "▶ Resume";
}
function resetAndPlay() {
  beats.forEach((b) => { b._firedRiser = b.t === 0; b._firedStinger = false; });
  nodeIndex.forEach((n) => { n.group.classList.add("pending"); n.group.classList.remove("pop"); });
  revealedCursor = null;
  revealedMaxRadius = R_MIN;
  cameraRadius = null;
  pausedProgress = 0;
  storyModeActive = true;
  lastBeatShown = null;
  captionEl.classList.remove("show");
  startPlayback();
}
playBtn.addEventListener("click", () => {
  if (reducedMotion) return;
  if (playing) { pausePlayback(); return; }
  if (currentRawT >= 0.999) { resetAndPlay(); return; }
  startPlayback();
});
scrub.addEventListener("input", () => {
  if (playing) pausePlayback();
  storyModeActive = true;
  const rawT = Number(scrub.value) / 1000;
  currentRawT = rawT;
  pausedProgress = rawTToMovieProgress(rawT);
  setDayCursor(Math.floor(rawT * totalDays), false); // direct manipulation: instant, no stagger
  applyCamera(cameraRadius === null ? 0 : 0.15);
  updateCaptionDisplay(rawT);
  // Dragging to the very end should offer a fresh replay, not a stale
  // "Resume" left over from whatever the button said before the drag.
  playBtn.textContent = rawT >= 0.999 ? "▶ Play the story" : "▶ Resume";
});

if (reducedMotion) {
  playBtn.disabled = true;
  playBtn.textContent = "Motion reduced — use the scrub bar";
}
</script>
</body>
</html>
