const DATA = {"memory":[{"id":"E1","title":"reachability vs rules tests","date":"2026-07-23","tags":["gamedev","testing","ai","balance","pathfinding","simulation"],"what":"All per-move rules unit tests passed (203 assertions) yet the game objective was unreachable — a simulator running 900 full headless games showed a 0% escape rate that step-level tests never caught.","rule":"For any goal-directed system (game objective, agent task, workflow), add a reachability/outcome test that runs the whole thing to a terminal state many times, separate from correctness tests of the steps — \"every step is correct\" does not imply \"the goal is reachable\".","verified":true},{"id":"E2","title":"threejs fog culls overview","date":"2026-07-23","tags":["gamedev","3d","threejs","rendering","camera"],"what":"The atmospheric close-up camera looked correct, but switching to the overview/top camera rendered a completely black screen with no error and no warning.","rule":"When a 3D scene renders blank only from certain camera distances, suspect fog far (or the camera near/far clip planes) before the scene graph; scale distance-based effects to the camera that is actually active.","verified":true},{"id":"E3","title":"github pages deploy default branch","date":"2026-07-24","tags":["devops","ci","github-actions","github-pages","deployment"],"what":"Automating a GitHub Pages deploy for a static browser game cost an extra full build-fix-retry cycle because of two non-obvious platform constraints that surface late (only at deploy time), not at authoring time.","rule":"For GitHub Pages via Actions, plan to deploy from the DEFAULT branch — the github-pages environment blocks non-default branches by default, and it fails at deploy setup (0 steps, 404 log), not at authoring. Also: enabling/reading Pages may be blocked over a restricted API proxy, so drive it from inside the workflow (configure-pages enablement:true), and always curl the final URL to confirm it serves.","verified":true},{"id":"E4","title":"flat menu list nav leak","date":"2026-07-25","tags":["gamedev","ui","input","gamepad","gamedesign"],"what":"A gamepad/keyboard menu bug reported as \"every button except one launches the game directly\" turned out to be a single root cause: up/down/left/right directional nav all cycled through ONE flat list mixing a difficulty row and mode/play buttons, so ANY direction could land focus on a play button, and the confirm button then instantly started a game from wherever focus landed.","rule":"When adding directional (gamepad/keyboard) navigation over a UI with visually distinct groups/rows, never flatten all focusable elements into one linear index — model the grid's real rows/columns/groups explicitly, and let each direction move on only its own axis within the current group. A flat list is fine for a single homogeneous row; it silently breaks the moment two different-purpose control groups sit on the same screen.","verified":true},{"id":"E5","title":"stall detection needs best ever not turnover","date":"2026-07-24","tags":["gamedev","algorithm","ai","gamedesign"],"what":"A stall/deadlock detector for an AI agent reset its \"stuck\" counter on any turn-over-turn improvement, so a slow oscillation (advance one turn, retreat the next, repeat) never tripped it — the agent stayed genuinely stuck for 500+ simulated rounds while the counter kept reporting \"just made progress.\"","rule":"When building a stall/no-progress/deadlock detector, never gate the reset on \"better than last observation\" — gate it on \"better than the best observation ever seen.\" A previous-turn-relative check is blind to oscillation and slow drift; a best-ever check is not, and costs nothing extra (one running minimum, no history buffer).","verified":true},{"id":"E6","title":"interact in place tile marked passable","date":"2026-07-25","tags":["gamedev","algorithm","pathfinding","ai","gamedesign"],"what":"An AI's pathfinder routed through a tile it could never actually cross, causing the AI to waste every move point re-triggering the same tile forever — a 500+ simulated-round infinite stall, invisible until a whole-run simulator with a generous round budget was used to hunt it down.","rule":"Whenever a tile/cell's move-resolution logic has a special case for \"stepping toward this doesn't relocate you,\" audit EVERY OTHER place that asks \"is this cell passable\" (pathfinding, connectivity/reachability generation, AI planning) for the same exclusion — a walkability check and a move resolver silently disagreeing about occupancy produces routes that look valid to the planner and are invisible-until-executed dead ends, and a per-turn \"did anything change\" check can hide the failure indefinitely since the planner re-derives the same \"valid\" (but impossible) path every time.","verified":true},{"id":"E7","title":"squash merge reused branch conflicts","date":"2026-07-24","tags":["git","process","workflow","tooling"],"what":"Opening a second PR from the same long-lived feature branch, after the first PR from that branch was squash-merged, got rejected by the GitHub API with a real \"merge conflicts\" (405, `mergeable_state: \"dirty\"`) — even though a manual diff proved the new commit's content applied cleanly and introduced zero actual conflicting lines.","rule":"A long-lived branch that gets squash-merged more than once must be re-synced onto its base (reset + replay only the unmerged commits) before EVERY subsequent PR from it — not just once, not only when a conflict actually appears. Treat \"PR from a branch with prior squash-merged history\" as needing this step by default, the same way `git pull --rebase` is the default after any shared-branch fast-forward, rather than debugging a \"phantom\" conflict after the fact.","verified":true},{"id":"E8","title":"pages deploy succeeds but live url 404s","date":"2026-07-26","tags":["devops","github-actions","github-pages","deployment"],"what":"A GitHub Pages deploy via Actions can report `success` on BOTH the build and deploy jobs, yet the live served URL returns HTTP 404 for a period afterward — not once, but reproducibly on every single deploy across an entire session (10+ occurrences), and not always cleared by exactly one retry (one occurrence needed a second `workflow_dispatch` after the first retry still 404'd, three curl checks in a row).","rule":"For GitHub Pages via Actions, \"the Action succeeded\" and \"the URL serves the new content\" are two DIFFERENT claims that must be verified separately and in sequence — never report a Pages deploy as done from Actions-run status alone; always live-curl-verify, and treat a first (or even second) 404 immediately after a reported-success deploy as an expected propagation window to retry through, not a signal to start debugging the workflow or Pages settings.","verified":true},{"id":"E9","title":"gated hud still leaked via unaudited log channel","date":"2026-07-26","tags":["gamedesign","gamedev","ui","security"],"what":"A hidden-information game's core secret (which direction the \"seeker\" role is truly watching) was correctly role-gated on its PRIMARY display surface (the HUD stat + a 3D wedge) earlier in the project, but a SEPARATE surface reading from the same underlying event stream — a scrolling text log — had zero gating at all, unconditionally showing the real value to every viewer regardless of role. The leak sat live in a shipped beta for several releases before a playtester's unrelated complaint (\"the log is boring, I never read it\") prompted a closer look that surfaced it.","rule":"When a hidden-information game's secret leaks via one presentation surface and gets fixed there, explicitly enumerate every OTHER surface reading from the same underlying state/event source (log, replay, summary, debug view, notification) and audit each one against the same \"who's allowed to see this\" question — don't assume a fix on the first surface found implies the others were already safe. Write the regression test against the SECRET ITSELF (assert the string/value never appears for the wrong viewer), not just against the surface where the original bug was found.","verified":true},{"id":"E10","title":"role check must become instance aware at every handoff","date":"2026-07-26","tags":["gamedev","architecture","state","multi-agent"],"what":"Scaling a single-player mode from 1 controllable entity to N (single prisoner -> a 3-prisoner group) required auditing THREE separate turn-handoff points in the control flow, not one — a boolean \"does the human control this role\" check that was correct when the role only ever mapped to one entity became silently wrong (would have stalled the game waiting on input that never arrives) the moment that role could map to multiple entity instances, only some of which are human-controlled.","rule":"When a boolean \"is this human-controlled\" check was written for a SINGULAR entity per role and the role is being generalized to admit MULTIPLE entities (companions, additional agents, a squad), don't just fix the one input gate that's obviously wrong — grep every OTHER decision point in the turn/state machine that implicitly assumed \"if not human, it's always AI\" or \"there's only ever one entity to check,\" since a turn-based flow with N handoff points needs the SAME instance-aware audit applied at all N, not just the first one found. This generalizes a known multi-agent-scale-out failure mode (Brain: an \"undo my own action\" bug that indexed a per-agent stack instead of the shared stack's actual top, invisible at N=1 by mathematical necessity) — cardinality bugs are invisible until you actually run at N>1, so treat \"we're about to support more than one\" as a trigger to re-audit every place touching that entity, not just the newest code path.","verified":true},{"id":"E11","title":"viewer vantage must not be derived from turn order","date":"2026-07-26","tags":["rendering","camera","multi-entity"],"what":"Camera follow, field-of-view masking, the exp let pinned = null;
function showTip(evt, html) {
  tip.innerHTML = html;
  tip.classList.add("show");
  moveTip(evt);
}
function moveTip(evt) {
  const pad = 16;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + 330 > window.innerWidth) x = evt.clientX - 330 - pad;
  if (y + 160 > window.innerHeight) y = evt.clientY - 160 - pad;
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}
function hideTip() {
  if (pinned) return;
  tip.classList.remove("show");
}
document.addEventListener("mousemove", (e) => { if (tip.classList.contains("show")) moveTip(e); });

// ---- Tensions: arc segments on the inner ring ------------------------------
{
  const n = DATA.tensions.length || 1;
  const gapDeg = 4;
  const span = 360 / n - gapDeg;
  DATA.tensions.forEach((t, i) => {
    const start = i * (360 / n) + gapDeg / 2;
    const end = start + span;
    const [x1, y1] = polar(R_TENSION, start);
    const [x2, y2] = polar(R_TENSION, end);
    const large = span > 180 ? 1 : 0;
    const path = el("path", {
      class: "arc",
      d: `M ${x1} ${y1} A ${R_TENSION} ${R_TENSION} 0 ${large} 1 ${x2} ${y2}`,
      fill: "none",
      stroke: STATUS_COLOR[t.status] || "#ff6b7a",
      "stroke-width": 14,
      "stroke-linecap": "round",
      opacity: 0.85,
      style: "color:" + (STATUS_COLOR[t.status] || "#ff6b7a"),
    });
    const tooltip = `<div class="tt">${t.id} · ${t.kind}</div><div>${t.title}</div>
      <div class="tk" style="margin-top:6px">${t.statusText}</div>
      <div style="margin-top:4px">${t.summary}</div>`;
    path.addEventListener("mouseenter", (e) => showTip(e, tooltip));
    path.addEventListener("mouseleave", hideTip);
    path.addEventListener("click", () => togglePin(path, tooltip));
    svg.appendChild(path);
  });
}

// ---- Memory: dots on the middle ring, chronological by id ------------------
{
  const n = DATA.memory.length || 1;
  DATA.memory.forEach((m, i) => {
    const deg = (i / n) * 360;
    const [x, y] = polar(R_MEMORY, deg);
    const color = tagColor(m.tags);
    const dot = el("circle", {
      class: "node", cx: x, cy: y, r: 6, fill: color, stroke: "#05070d",
      "stroke-width": 1.5, style: "color:" + color,
    });
    const tooltip = `<div class="tt">${m.id} · ${m.title}</div>
      <div class="tk">${m.date}${m.verified ? " · verified" : " · assumed"} · ${m.tags.map((t) => "[" + t + "]").join("")}</div>
      <div style="margin-top:4px">${m.what}</div>
      ${m.rule ? '<div style="margin-top:6px;color:#8595b0"><i>' + m.rule + "</i></div>" : ""}`;
    dot.addEventListener("mouseenter", (e) => showTip(e, tooltip));
    dot.addEventListener("mouseleave", hideTip);
    dot.addEventListener("click", () => togglePin(dot, tooltip));
    svg.appendChild(dot);
  });
}

// ---- Ideas: hollow dots on the outer ring, dormant kernels -----------------
{
  const n = DATA.ideas.length || 1;
  DATA.ideas.forEach((k, i) => {
    const deg = (i / n) * 360 + 360 / (n * 2);
    const [x, y] = polar(R_IDEA, deg);
    const dot = el("circle", {
      class: "node", cx: x, cy: y, r: 7, fill: "rgba(255,176,32,0.12)",
      stroke: "var(--idea)", "stroke-width": 1.5, "stroke-dasharray": "2 2",
      style: "color: var(--idea)",
    });
    const tooltip = `<div class="tt">${k.title}</div>
      <div class="tk">${k.domain} · ${k.slug}</div>
      <div style="margin-top:4px">${k.summary}</div>`;
    dot.addEventListener("mouseenter", (e) => showTip(e, tooltip));
    dot.addEventListener("mouseleave", hideTip);
    dot.addEventListener("click", () => togglePin(dot, tooltip));
    svg.appendChild(dot);
  });
}

function togglePin(node, html) {
  if (pinned === node) {
    node.classList.remove("pinned");
    pinned = null;
    tip.classList.remove("show");
    return;
  }
  if (pinned) pinned.classList.remove("pinned");
  pinned = node;
  node.classList.add("pinned");
  tip.innerHTML = html;
  tip.classList.add("show");
}

// ---- Ring labels ------------------------------------------------------------
svg.appendChild((() => { const t = el("text", { class: "ring-label", x: CX, y: CY - R_TENSION - 8, "text-anchor": "middle" }); t.textContent = "tensions"; return t; })());
svg.appendChild((() => { const t = el("text", { class: "ring-label", x: CX, y: CY - R_MEMORY - 8, "text-anchor": "middle" }); t.textContent = "memory"; return t; })());
svg.appendChild((() => { const t = el("text", { class: "ring-label", x: CX, y: CY - R_IDEA - 8, "text-anchor": "middle" }); t.textContent = "ideas"; return t; })());

// ---- Legend + header ---------------------------------------------------------
document.getElementById("gendate").textContent = DATA.generated;
document.getElementById("subtitle").textContent =
  `${DATA.memory.length} lessons · ${DATA.tensions.length} tensions · ${DATA.ideas.length} idea kernels`;
const legend = document.getElementById("legend");
const legendItems = [
  ["open tension", STATUS_COLOR.open],
  ["leaning", STATUS_COLOR.leaning],
  ["resolved", STATUS_COLOR.resolved],
  ["memory (by tag)", "#dfe8f7"],
  ["idea kernel", "var(--idea)"],
];
for (const [label, color] of legendItems) {
  const item = document.createElement("div");
  item.className = "item";
  item.innerHTML = `<span class="swatch" style="background:${color}"></span>${label}`;
  legend.appendChild(item);
}
</script>
</body>
</html>
